name: Deploy AttendSalary

on:
  push:
    branches:
      - master
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend Client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}
        run: |
          cd client
          npm install
          npm run build

      - name: Copy Files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          # We only copy the built frontend (dist) and the backend source. 
          # We purposefully leave out the heavy client node_modules!
          source: "client/dist/,server/"
          target: "/home/ubuntu/attendsalary"

      - name: Install Server Dependencies and Restart Backend
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"
            
            cd /home/ubuntu/attendsalary/server
            npm install --omit=dev
            # Start or restart pm2 process
            pm2 restart attendsalary-backend || pm2 start src/index.js --name attendsalary-backend
